[package]
name = "linux-audio-transcriptor"
version = "0.1.0"
edition = "2021"
description = "Live meeting transcription and summarization for Linux"
license = "MIT"

[dependencies]
# Audio capture
cpal = "0.15"
pipewire = "0.8"  # PipeWire for system audio capture

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# LLM inference
llama-cpp-2 = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
dirs = "5"
signal-hook = "0.3"
libc = "0.2"
